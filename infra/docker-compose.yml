services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: media_control
      MARIADB_USER: ${YMC_DB_USERNAME:?required}
      MARIADB_PASSWORD: ${YMC_DB_PASSWORD:?required}
      MARIADB_ROOT_PASSWORD: ${YMC_DB_ROOT_PASSWORD:?required}
    command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci","--transaction-isolation=READ-COMMITTED","--binlog-format=ROW"]
    volumes:
      - mariadb-data:/var/lib/mysql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL","healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
  server:
    build:
      context: ../server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      YMC_DB_URL: jdbc:mariadb://db:3306/media_control
      YMC_DB_USERNAME: ${YMC_DB_USERNAME:?required}
      YMC_DB_PASSWORD: ${YMC_DB_PASSWORD:?required}
      YMC_AGENT_BOOTSTRAP_TOKEN: ${YMC_AGENT_BOOTSTRAP_TOKEN:?required}
      YMC_POLICY_SIGNING_PRIVATE_KEY: ${YMC_POLICY_SIGNING_PRIVATE_KEY:?required}
      YMC_POLICY_SIGNING_PUBLIC_KEY: ${YMC_POLICY_SIGNING_PUBLIC_KEY:?required}
      YMC_POLICY_SIGNING_KEY_ID: ${YMC_POLICY_SIGNING_KEY_ID:?required}
      YMC_UNINSTALL_SIGNING_PRIVATE_KEY: ${YMC_UNINSTALL_SIGNING_PRIVATE_KEY:?required}
      YMC_UNINSTALL_SIGNING_PUBLIC_KEY: ${YMC_UNINSTALL_SIGNING_PUBLIC_KEY:?required}
      YMC_UNINSTALL_SIGNING_KEY_ID: ${YMC_UNINSTALL_SIGNING_KEY_ID:?required}
      YMC_TLS_KEYSTORE: file:/run/secrets/server-keystore.p12
      YMC_TLS_KEYSTORE_PASSWORD: ${YMC_TLS_KEYSTORE_PASSWORD:?required}
    ports:
      - "8443:8443"
    volumes:
      - ./secrets/server-keystore.p12:/run/secrets/server-keystore.p12:ro
    networks: [api,data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL","curl --fail --silent --insecure https://localhost:8443/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 12
volumes:
  mariadb-data:
networks:
  api:
  data:
    internal: true
